name: Checks and Validation
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt

      - name: refresh apt index (ubuntu only)
        run: sudo apt-get update

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # latest
        with:
          packages: pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev
          version: 1.3

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: "linter_cache"

      - name: Install oxfmt
        run: npm install -g oxfmt@0.73.0

      - name: Run linters
        uses: profiidev/rust-lint-action@16801b02ca2bc0441e458d7f713d8a0e8d417927 # v4
        with:
          rustfmt: true
          clippy: true
          auto_fix: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          continue_on_error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          results_file: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'lint-results.json' || '' }}
          oxfmt: true
          git_sign_commits: true
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Upload lint results
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 5

  flake:
    name: Check flake
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake check
        run: nix flake check
