[package]
name = "proton"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
tauri-plugin-store = "2.5.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = [
  "json",
  "multipart",
  "stream",
  "form",
] }
tokio = { version = "1.53.3", features = ["process"] }
base64 = "0.23.1"
image = "0.25.10"
uuid = { version = "1.28.0", features = ["v4"] }
sha1 = "0.11.0"
hex = "0.4.3"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tauri-plugin-process = "2.4.0"
notify = "8.2.0"
async-trait = "0.1.92"
serde-xml-rs = "0.8.2"
async_zip = { version = "0.0.19", features = [
  "chrono",
  "tokio-fs",
  "deflate",
  "bzip2",
  "zstd",
  "deflate64",
] }
tokio-util = { version = "0.7.20", features = ["compat"] }
sysinfo = "0.39.6"
futures-util = "0.3.34"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tauri-plugin-window-state = "2.5.0"
