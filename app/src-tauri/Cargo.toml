[package]
name = "proton"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
proton_utils.workspace = true
proton_store.workspace = true
proton_config.workspace = true
proton_versions.workspace = true
proton_account.workspace = true
proton_profiles.workspace = true
proton_content.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
base64.workspace = true
log.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
