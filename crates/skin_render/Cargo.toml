[package]
name = "proton_skin_render"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
gpui-kit = { version = "0.7.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
# same major + features as gpui-pre-wgpu so the workspace builds a single wgpu
wgpu = { version = "29", default-features = false, features = [
  "std",
  "parking_lot",
  "wgsl",
  "vulkan",
  "metal",
  "gles",
] }
