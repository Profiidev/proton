[package]
name = "proton_skin_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
gpui-kit = { version = "0.8.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
tracing.workspace = true
# same major + features as gpui-pre-wgpu so the workspace builds a single wgpu
wgpu = { version = "30", default-features = false, features = [
  "std",
  "parking_lot",
  "wgsl",
  "vulkan",
  "metal",
  "gles"
] }

[dev-dependencies]
gpui-kit = { version = "0.8.0", default-features = false, features = [
  "test-support"
] }
